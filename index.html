<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's my age?</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .time-diff {
            font-size: 34px;
            font-weight: bold;
            margin: 10px;
        }
        .progress-container {   
            width: 100%; 
            height: 10px;  
            background-color: #ddd; 
            border-radius: 5px; 
            overflow: hidden;
            margin-top: 15px;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #4caf50; 
            transition: width 1s linear;
        }
        #progress-text {
            margin-top: 5px;
            font-size: 16px;
            font-weight: bold;
        }        
    </style>
</head>
<body>

    <div class="container">
        <div id="mode" class="time-diff"></div>
        
        <div id="date"></div>
        <div id="zone"></div>
        <div id="result" class="time-diff">Enter a date in the URL: ?date=DDMMYYYY</div>
        <!-- Day Progress Bar -->
        <div class="progress-container">
            <div id="progress-bar"></div> 
        </div>
        <div id="progress-text">Loading...</div>
        <div id="log"></div>
    </div>
    

    <audio id="tick-sound"> 
        <source src="tick.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        function playTickSound() {
            let tickSound = document.getElementById("tick-sound");
            tickSound.currentTime = 0; // Reset sound to start
            tickSound.play().catch(error => console.log("Sound playback error:", error));
        }   
        // Play ticking sound every second
        setInterval(playTickSound, 1000);
     
        function updateDayProgress() {
            let now = new Date();
            let secondsPassed = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            let totalSecondsInDay = 24 * 3600;
    
            let percentagePassed = (secondsPassed / totalSecondsInDay) * 100;
            let percentageLeft = 100 - percentagePassed;
    
            // Update the progress bar width
            document.getElementById("progress-bar").style.width = percentagePassed + "%";
   
            // Update the text to show remaining percentage   
            document.getElementById("progress-text").innerText = `${percentageLeft.toFixed(2)}% of the day left`;

        }

        // Update every second
        setInterval(updateDayProgress, 1000);
        updateDayProgress(); // Run once on page load

        
        function getDateFromQuery() {
            const params = new URLSearchParams(window.location.search);
const dateStr = params.get("date"); // Format: DDMMYYYY[HH|HHMM|HHMMSS]
//document.getElementById("log").innerText =dateStr

    // Check for valid formats: 8 digits (date only), 10 digits (date+HH), 12 digits (date+HHMM), 14 digits (date+HHMMSS)
    if (!/^\d{8}(\d{2}|\d{4}|\d{6})?$/.test(dateStr)) {
        showError("Enter date like ?date=DDMMYYYY, DDMMYYYYHH, DDMMYYYYHHMM, or DDMMYYYYHHMMSS");
        return null;
    }

    let day = parseInt(dateStr.substring(0, 2));
    let month = parseInt(dateStr.substring(2, 4)) - 1;
    let year = parseInt(dateStr.substring(4, 8));
    
    let hours = 0;
    let minutes = 0;
    let seconds = 0;

 // Parse time based on length
    if (dateStr.length === 10) {
        // Format: DDMMYYYYHH
        hours = parseInt(dateStr.substring(8, 10));
    } else if (dateStr.length === 12) {
        // Format: DDMMYYYYHHMM
        hours = parseInt(dateStr.substring(8, 10));
        minutes = parseInt(dateStr.substring(10, 12));
    } else if (dateStr.length === 14) {
        // Format: DDMMYYYYHHMMSS
        hours = parseInt(dateStr.substring(8, 10));
        minutes = parseInt(dateStr.substring(10, 12));
        seconds = parseInt(dateStr.substring(12, 14));
    }

        // Validate time ranges
        if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59 || seconds < 0 || seconds > 59) {
            showError("Invalid time! Use 24-hour format HHMMSS.");
            return null;
        }
    

    let date = new Date(year, month, day, hours, minutes, seconds);

    // Validate date
    if (date.getDate() !== day || date.getMonth() !== month || date.getFullYear() !== year) {
        showError("Invalid date! Try again.");
        return null;
    }

            return date;
        }

        function showError(message) {
            document.getElementById("result").innerHTML = message;
        }

        function updateTimeDifference() {
            let inputDate = getDateFromQuery();
            if (!inputDate) return;

            function calculateDifference() {
    let now = new Date();
    
    let isFuture = inputDate > now;
    let laterDate = isFuture ? inputDate : now;
    let earlierDate = isFuture ? now : inputDate;
    
    // Calculate all components from the date difference
    let years = laterDate.getFullYear() - earlierDate.getFullYear();
    let months = laterDate.getMonth() - earlierDate.getMonth();
    let days = laterDate.getDate() - earlierDate.getDate();
    let hours = laterDate.getHours() - earlierDate.getHours();
    let minutes = laterDate.getMinutes() - earlierDate.getMinutes();
    let seconds = laterDate.getSeconds() - earlierDate.getSeconds();

    // Adjust from smallest to largest unit (borrowing system)
    if (seconds < 0) {
        minutes--;
        seconds += 60;
    }
    
    if (minutes < 0) {
        hours--;
        minutes += 60;
    }
    
    if (hours < 0) {
        days--;
        hours += 24;
    }
    
    if (days < 0) {
        months--;
        let daysInPrevMonth = new Date(laterDate.getFullYear(), laterDate.getMonth(), 0).getDate();
        days += daysInPrevMonth;
    }
    
    if (months < 0) {
        years--;
        months += 12;
    }

    let mode = isFuture ? "Countdown Mode" : "Age Mode";
    document.getElementById("mode").innerHTML = `${mode}`;
    let prefix = isFuture ? "Time until:" : "Time since:";
    
   // Split at GMT
    let fullDateString = inputDate.toString(); // "Fri Sep 26 2025 17:32:00 GMT+0530 (India Standard Time)"
    let parts = fullDateString.split('GMT');
    
    let inputDateFull = parts[0].trim(); // "Fri Sep 26 2025 17:32:00"
    let timeZone = parts[1] ? 'GMT' + parts[1] : 'GMT+0000'; // "GMT+0530 (India Standard Time)"
    document.getElementById("date").innerHTML = `${prefix} ${inputDateFull}`;
    document.getElementById("zone").innerHTML = `${timeZone}`;
    
    document.getElementById("result").innerHTML = `
        ${years} Years<br>
        ${months} Months<br>
        ${days} Days<br>
        ${hours} Hours<br>
        ${minutes} Minutes<br>
        ${seconds} Seconds
    `;
}

            calculateDifference();
            setInterval(calculateDifference, 1000);
        }

        updateTimeDifference();
    </script>

</body>
</html>
